<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>FutTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⚽ FutTube</h1>
</header>

<main class="feed">

  <div class="post">
    <video controls>
      <source src="assets/videos/gol.mp4" type="video/mp4">
    </video>

    <h2>Gol incrível 🔥</h2>

    <div class="actions">
      <button onclick="likePost()">❤️ Curtir</button>
      <span id="likes">0 curtidas</span>
    </div>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
